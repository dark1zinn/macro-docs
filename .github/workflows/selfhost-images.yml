        cache-from: type=gha,scope=docker-sync-service.Dockerfile
        cache-to: type=gha,scope=docker-sync-service.Dockerfile,mode=max
    - name: Build and push lexical
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: docker/lexical-service.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-lexical:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-lexical:sha-${{ github.sha }}
        cache-from: type=gha,scope=docker-lexical-service.Dockerfile
        cache-to: type=gha,scope=docker-lexical-service.Dockerfile,mode=max
    - name: Build and push websocket
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: docker/websocket-service.Dockerfile
