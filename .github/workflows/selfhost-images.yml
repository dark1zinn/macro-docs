# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/selfhost_images.rs
name: Self-host images
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      images:
        description: 'Image groups to build, comma-separated: rust, gateway, workers'
        type: string
        default: rust,gateway,workers
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.images, 'rust')
    name: Rust services and init
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Start resource monitor
      run: |
        log=/tmp/resource-monitor.log
        : > "$log"
        (
          end=$((SECONDS + 21600))
          while [ "$SECONDS" -lt "$end" ]; do
            { date; df -h / /mnt; free -m; } || true
            sleep 60
          done
        ) >> "$log" 2>&1 </dev/null &
        echo "$!" > /tmp/resource-monitor.pid
    - name: Move Docker storage to /mnt
      run: |
        df -h / /mnt
        sudo systemctl stop docker.socket docker
        sudo mkdir -p /mnt/docker
        config='{"data-root": "/mnt/docker"}'
        if [ -s /etc/docker/daemon.json ]; then
          config="$(sudo jq --arg root /mnt/docker '. + {"data-root": $root}' /etc/docker/daemon.json)"
        fi
        echo "$config" | sudo tee /etc/docker/daemon.json >/dev/null
        sudo systemctl start docker
        docker info --format 'Docker root: {{.DockerRootDir}}'
        df -h / /mnt
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
        df -h /
    - id: prefix
      name: Image prefix
      run: |
        echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macro-selfhost" >> "$GITHUB_OUTPUT"
        tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push services
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/rust.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-services:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-services:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-rust.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-rust.Dockerfile,mode=max
        target: services
        build-args: CARGO_BUILD_JOBS=2
    - name: Build and push init
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/rust.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-init:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-init:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-rust.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-rust.Dockerfile,mode=max
        target: init
        build-args: CARGO_BUILD_JOBS=2
    - name: Print resource log
      if: always()
      run: |
        if [ -f /tmp/resource-monitor.pid ]; then
          pid="$(cat /tmp/resource-monitor.pid)"
          pkill -P "$pid" 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
        fi
        cat /tmp/resource-monitor.log 2>/dev/null || echo "no resource log"
