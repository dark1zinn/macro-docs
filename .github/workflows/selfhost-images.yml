        cache-to: type=gha,scope=docker-websocket-service.Dockerfile,mode=max
    - name: Build and push ai-editing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/ai-editing-worker.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-ai-editing:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-ai-editing:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-ai-editing-worker.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-ai-editing-worker.Dockerfile,mode=max
    - name: Build and push opensearch
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: infra/local/opensearch
        file: infra/local/opensearch/Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-opensearch:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-opensearch:sha-${{ github.sha }}
        cache-from: type=gha,scope=infra-local-opensearch-Dockerfile
        cache-to: type=gha,scope=infra-local-opensearch-Dockerfile,mode=max
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
