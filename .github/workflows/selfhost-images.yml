name: Self-host images
'on':
  push:
    branches:
    - development
    tags:
    - selfhost-v*
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rust:
    name: Rust services and init
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
        df -h /
    - id: prefix
      name: Image prefix
      run: |
        echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macro-selfhost" >> "$GITHUB_OUTPUT"
        tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push services
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/rust.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-services:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-services:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-rust.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-rust.Dockerfile,mode=max
        target: services
    - name: Build and push init
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/rust.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-init:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-init:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-rust.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-rust.Dockerfile,mode=max
        target: init
  gateway:
    name: Gateway and web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Free disk space
      run: |
