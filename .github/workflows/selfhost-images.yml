        docker system prune -af
        df -h /
    - id: prefix
      name: Image prefix
      run: |
        echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/macro-selfhost" >> "$GITHUB_OUTPUT"
        tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push gateway
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: '.'
        file: selfhost/docker/gateway.Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |-
          ${{ steps.prefix.outputs.prefix }}-gateway:${{ steps.prefix.outputs.tag }}
          ${{ steps.prefix.outputs.prefix }}-gateway:sha-${{ github.sha }}
        cache-from: type=gha,scope=selfhost-docker-gateway.Dockerfile
        cache-to: type=gha,scope=selfhost-docker-gateway.Dockerfile,mode=max
  workers:
    name: Workers and search
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 360
